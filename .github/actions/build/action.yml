name: Build Chromium
description: Build ungoogled-chromium with Docker and upload build cache

inputs:
  prepare-only:
    description: "If 'true', run only preparation steps."
    required: false
    default: "false"
  use-existing-image:
    description: "If 'true', skip Docker image building and use existing image."
    required: false
    default: "false"
  final:
    description: "If 'true', this job is the last and should fail if it runs out of time"
    required: false
    default: "false"
  restore-run-id:
    description: "If set, download the build-cache artifact from this run id instead of the current run's (download-artifact's run-id+github-token params - same-run download-artifact can't see another run's artifacts). Only meaningful together with use-existing-image: true; the Docker image itself is always taken from the current run's own `prep` job, since rebuilding it is cheap and it isn't source-tree state."
    required: false
    default: ""

outputs:
  status:
    description: "Build status: 'running' if build isn't complete, 'completed' if it is."
    value: ${{ steps.build.outputs.status }}

runs:
  using: composite
  steps:
    - name: Download Docker image
      if: ${{ inputs.use-existing-image == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: docker-image-${{ env.ARCH }}
        path: /tmp

    - name: Load Docker image
      if: ${{ inputs.use-existing-image == 'true' }}
      shell: bash
      run: docker load -i /tmp/chromium-builder.tar

    - name: Download build cache
      if: ${{ inputs.prepare-only != 'true' && inputs.restore-run-id == '' }}
      uses: actions/download-artifact@v8
      with:
        name: build-cache-${{ env.ARCH }}
        path: .github/cache/

    - name: Download build cache from another run (resume)
      if: ${{ inputs.prepare-only != 'true' && inputs.restore-run-id != '' }}
      uses: actions/download-artifact@v8
      with:
        name: build-cache-${{ env.ARCH }}
        path: .github/cache/
        run-id: ${{ inputs.restore-run-id }}
        github-token: ${{ github.token }}

    - name: Import build cache
      if: ${{ inputs.prepare-only != 'true' }}
      shell: bash
      run: bash ./.github/scripts/import-cache.sh

    - name: Build
      id: build
      shell: bash
      env:
        _prepare_only: ${{ inputs.prepare-only }}
        _use_existing_image: ${{ inputs.use-existing-image }}
        _gha_final: ${{ inputs.final }}
      run: |
        # The step still fails exactly as before - the exit code is captured
        # only so a deterministic failure can be recorded on the way out, then
        # re-raised untouched. Nothing downstream sees a different status, so
        # "Export build cache" still does not run after a failed build.
        #
        # A non-zero code here can only be a failure that reproduces.
        # .github/scripts/build.sh converts the ordinary out-of-time case
        # (ninja killed by `timeout`, rc 124) into status=running and exit 0
        # before this point, so by the time a non-zero code reaches here it is
        # a compile error, a patch failure, or a missing-output check. A
        # runner death never gets here at all, and that is the case worth
        # resuming.
        set +e
        bash ./scripts/docker-build.sh
        rc=$?
        if [ "$rc" != 0 ]; then
          mkdir -p .github/stage-status
          printf 'exit_code=%s\nrun_id=%s\ncommit=%s\narch=%s\n' \
            "$rc" "$GITHUB_RUN_ID" "$GITHUB_SHA" "${ARCH:-unknown}" \
            > .github/stage-status/build-error.txt
        fi
        exit $rc

    - name: Upload deterministic-failure marker
      # hashFiles is the guard that keeps this honest: it only matches when the
      # build step itself wrote the file, so an earlier step failing (image
      # download, cache import - both plausibly transient) does not get
      # mislabelled as a failure that cannot be resumed.
      if: failure() && hashFiles('.github/stage-status/build-error.txt') != ''
      uses: actions/upload-artifact@v7
      with:
        name: build-error-${{ env.ARCH }}
        path: .github/stage-status/
        retention-days: 10
        overwrite: true

    - name: Export build cache
      shell: bash
      run: bash ./.github/scripts/export-cache.sh

    - name: Upload build cache
      uses: actions/upload-artifact@v7
      with:
        name: build-cache-${{ env.ARCH }}
        path: .github/cache/build-cache-${{ env.ARCH }}.tar.zst
        if-no-files-found: error
        overwrite: true
