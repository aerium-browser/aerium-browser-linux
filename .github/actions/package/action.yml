name: Package AppImage
description: Package ungoogled-chromium as AppImage and tar.xz, upload artifacts

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    # The checkpoint alternates between build-cache-<arch> and
    # build-cache-<arch>-b, so the name to download has to be resolved rather
    # than assumed - see .github/scripts/checkpoint-slot.sh. Asking for the
    # base name works only when the number of saves happens to be odd, and the
    # first run under the two-slot scheme ended on -b: run 33459797368 finished
    # compiling x86_64, then failed here with "Artifact not found for name:
    # build-cache-x86_64" while build-cache-x86_64-b sat in the run holding the
    # completed tree. Failing the run also cancelled the arm64 leg, which was
    # three hours into its third stage.
    - name: Resolve checkpoint slot
      id: restore-slot
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE: build-cache-${{ env.ARCH }}
      run: bash ./.github/scripts/checkpoint-slot.sh restore

    # A build that reaches packaging has a checkpoint by definition, so an
    # empty answer here is a bug rather than a state to tolerate - and a
    # download-artifact with an empty name fails obscurely.
    - name: Fail if no checkpoint was found
      if: ${{ steps.restore-slot.outputs.name == '' }}
      shell: bash
      run: |
        echo "::error::No build-cache-${ARCH} checkpoint in this run - nothing to package." >&2
        exit 1

    - name: Download build cache
      uses: actions/download-artifact@v8
      with:
        name: ${{ steps.restore-slot.outputs.name }}
        path: .github/cache/

    - name: Import build cache
      shell: bash
      run: bash ./.github/scripts/import-cache.sh

    - name: Package as AppImage with Docker
      shell: bash
      run: bash ./package/docker-package.sh

    - name: List build artifacts
      shell: bash
      run: ls -la build

    - name: Get version info
      id: version
      shell: bash
      run: |
        chromium_version=$(cat ungoogled-chromium/chromium_version.txt)
        ungoogled_revision=$(cat ungoogled-chromium/revision.txt)
        version="${chromium_version}-${ungoogled_revision}"
        echo "version=${version}" >> $GITHUB_OUTPUT
        echo "chromium_version=${chromium_version}" >> $GITHUB_OUTPUT
        echo "ungoogled_revision=${ungoogled_revision}" >> $GITHUB_OUTPUT

    - name: Upload AppImage artifact
      uses: actions/upload-artifact@v7
      with:
        name: aerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}-AppImage
        path: build/release/aerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}.AppImage*
        if-no-files-found: error
        compression-level: 0

    - name: Upload tar.xz artifact
      uses: actions/upload-artifact@v7
      with:
        name: aerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}-linux
        path: build/release/aerium-${{ steps.version.outputs.version }}-${{ env.ARCH }}_linux.tar.xz
        if-no-files-found: error
        compression-level: 0
