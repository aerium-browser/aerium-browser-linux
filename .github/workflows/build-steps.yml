name: Building Linux AppImage for ungoogled-chromium

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      resume-run-id:
        description: 'If set, build_part_01 resumes from this run''s last build-cache checkpoint instead of the fresh cache prep just produced.'
        required: false
        type: string
        default: ''

env:
  ARCH: ${{ inputs.arch }}

jobs:
  prep:
    name: Prepare resources
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with: { submodules: true }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and cache Docker image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: chromium-builder:trixie-slim
          outputs: type=docker,dest=/tmp/chromium-builder.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ inputs.arch }}
          path: /tmp/chromium-builder.tar
          retention-days: 1

      - name: Prepare build tree
        uses: ./.github/actions/build
        with:
          prepare-only: true
          use-existing-image: true

  build_part_01:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    needs: prep
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with:
          use-existing-image: true
          restore-run-id: ${{ inputs.resume-run-id }}

  build_part_02:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_01.result != 'skipped'
            && needs.build_part_01.outputs.deterministic != 'true'
            && needs.build_part_01.outputs.status != 'completed' }}
    needs: build_part_01
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_03:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_02.result != 'skipped'
            && needs.build_part_02.outputs.deterministic != 'true'
            && needs.build_part_02.outputs.status != 'completed' }}
    needs: build_part_02
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_04:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_03.result != 'skipped'
            && needs.build_part_03.outputs.deterministic != 'true'
            && needs.build_part_03.outputs.status != 'completed' }}
    needs: build_part_03
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_05:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_04.result != 'skipped'
            && needs.build_part_04.outputs.deterministic != 'true'
            && needs.build_part_04.outputs.status != 'completed' }}
    needs: build_part_04
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_06:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_05.result != 'skipped'
            && needs.build_part_05.outputs.deterministic != 'true'
            && needs.build_part_05.outputs.status != 'completed' }}
    needs: build_part_05
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_07:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_06.result != 'skipped'
            && needs.build_part_06.outputs.deterministic != 'true'
            && needs.build_part_06.outputs.status != 'completed' }}
    needs: build_part_06
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_08:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_07.result != 'skipped'
            && needs.build_part_07.outputs.deterministic != 'true'
            && needs.build_part_07.outputs.status != 'completed' }}
    needs: build_part_07
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_09:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    if: ${{ !cancelled() && needs.build_part_08.result != 'skipped'
            && needs.build_part_08.outputs.deterministic != 'true'
            && needs.build_part_08.outputs.status != 'completed' }}
    needs: build_part_08
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  build_part_10:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 350
    outputs:
      status: ${{ steps.build.outputs.status }}
      deterministic: ${{ steps.build.outputs.deterministic }}
    if: ${{ !cancelled() && needs.build_part_09.result != 'skipped'
            && needs.build_part_09.outputs.deterministic != 'true'
            && needs.build_part_09.outputs.status != 'completed' }}
    needs: build_part_09
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/build
        id: build
        with: { use-existing-image: true }

  package:
    runs-on: ${{ inputs.runs-on }}
    if: ${{ !cancelled() && !failure()
            && contains(fromJSON('["success", "skipped"]'),
                        needs.build_part_10.result)
            && needs.build_part_10.outputs.status != 'running' }}
    needs: build_part_10
    steps:
      - uses: actions/checkout@v5
        with: { submodules: true }
      - uses: ./.github/actions/package

  complete:
    runs-on: ubuntu-latest
    needs: [build_part_10, package]
    if: ${{ !cancelled() }}
    steps:
      - name: Verify the build finished and packaged
        run: |
          if [ "${{ needs.build_part_10.outputs.status }}" = 'running' ]; then
            echo "Build did not finish within 10 parts; resume from the saved cache."
            exit 1
          fi
          if [ "${{ needs.package.result }}" != 'success' ]; then
            echo "Packaging did not succeed (result: ${{ needs.package.result }})."
            exit 1
          fi
