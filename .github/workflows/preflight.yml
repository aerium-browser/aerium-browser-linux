name: preflight

# Aerium: compile the sources this project owns, and only those, so a syntax
# error is a twenty-minute answer rather than an eight-hour one.
#
# Build 81 is the case this exists for: a missing #include put an undeclared
# identifier in settings_ui.cc, and the build spent ten hours reaching it
# before saying so. Nothing about that error needed a browser to find.
#
# Deliberately not a gate on the real build. It runs beside it on the same
# push, so a red pre-flight is a signal to cancel a run that is going to fail
# anyway - not a dependency that would delay every green one.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'docker/**'
      - 'patches/**'
      - 'flags.linux.gn'
      - 'ungoogled-chromium'
      - '.github/workflows/preflight.yml'
      - '.github/scripts/**'

# The opposite of build.yml on purpose. A superseded pre-flight is worthless -
# it would report on a commit nobody is building any more - and it is cheap
# enough that killing one costs nothing.
concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile Aerium-owned sources
    runs-on: ubuntu-latest
    # Generous: the cost is dominated by the generated headers these objects
    # pull in, which is a first-build cost and not something measured yet.
    # The step prints its own elapsed time so the ceiling can come down once
    # there are real numbers.
    timeout-minutes: 150
    env:
      # x86_64 only. The C++ is architecture-independent and both desktop repos
      # carry the same patches, so one compile covers Linux arm64 and Windows
      # too - the point is the compiler's opinion of the source, not codegen.
      ARCH: x86_64
      _prepare_only: "false"
      _preflight: "true"
      _use_existing_image: "true"
      _gha_final: "false"
    steps:
      - name: Clone repository
        uses: actions/checkout@v5
        with: { submodules: true }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the builder image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: chromium-builder:trixie-slim
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare the tree and compile
        run: bash ./scripts/docker-build.sh
