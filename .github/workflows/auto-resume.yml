name: auto-resume
# When a build fails AND left a build cache behind, re-dispatch it with
# resume_run_id so transient runner deaths self-heal without a human
# noticing. Mirrors the Windows and Android repos' watchers; the differences
# are structural to this pipeline:
#   - the checkpoint here is the per-arch build-cache artifact
#     (build-cache-x86_64 / build-cache-arm64), so the presence check is a
#     prefix match rather than one fixed name
#   - resume-run-id only redirects build_part_01's cache source; `prep` still
#     re-runs, which is cheap relative to the compile
# Three kinds of failure are deliberately NOT resumed, because resuming them
# only spends the cap:
#   - no build cache at all: the run died in prep, before exporting anything
#   - a cache but no completed build part: prep exports build-cache-<arch> too,
#     so a run stopped during build_part_01 leaves one holding a source tree
#     with nothing compiled in it. Resuming that recompiles from zero
#   - a build-error-* marker: the build action records one whenever the build
#     script returned non-zero, which by then can only mean a failure that
#     reproduces (the ordinary out-of-time case becomes status=running and
#     exit 0 first). This is the case the no-cache check cannot catch on its
#     own, since a compile error deep in the build leaves behind the cache an
#     earlier part uploaded.
# Those three, and the cap, fail this job rather than exiting green, so a
# stalled build is visible in the Actions list instead of only in a log. The
# one exception is a run someone stopped by hand before any part finished:
# superseding a run that way is deliberate and routine, so it exits green.
on:
  workflow_run:
    workflows: ['Build Linux AppImage for Aerium']
    types: [completed]

permissions:
  actions: write

jobs:
  resume:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Resume from the failed run's build cache
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          # Cancelled counts as stopped, not just failed - the Windows repo
          # lost nine hours of finished work to a cancellation nobody made,
          # because a cancelled run reports conclusion 'cancelled' and this
          # job only matched 'failure', so its checkpoint went unread.
          #
          # But two kinds of cancellation are routine and must NOT be resumed:
          # superseding an in-flight build by pushing a newer commit, and
          # killing a duplicate run on the same commit. Resuming either would
          # fight the rule that only the newest commit builds. Telling them
          # apart needs no guessing - a superseded run is one whose commit is
          # no longer the branch head, and a duplicate is one that still has a
          # sibling running. Anything else was interrupted.
          #
          # These exit 0, not 1: declining to resume a build someone cancelled
          # on purpose is this job working, and marking it red would put a
          # failure in the Actions list every time a superseded run is killed.
          if [ "$CONCLUSION" = cancelled ]; then
            head_sha=$(gh api "repos/$REPO/commits/master" --jq '.sha')
            if [ "$head_sha" != "$HEAD_SHA" ]; then
              echo "master is now $head_sha - run $RUN_ID was superseded, not interrupted."
              exit 0
            fi
            live=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            if [ "$live" -gt 0 ]; then
              echo "$live run(s) for $HEAD_SHA still active - run $RUN_ID was a duplicate, not an interruption."
              exit 0
            fi
            echo "Run $RUN_ID was cancelled with nothing replacing it - treating as an interruption."
          fi

          names=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')

          # A deterministic failure must not be resumed, and unlike the
          # no-cache case it can happen with a cache present. The cache
          # artifact is per-run and overwritten by each part, so a run whose
          # build_part_06 hit a compile error still carries the cache
          # build_part_05 uploaded - the guard below would see it and resume
          # into the identical error. The build action now marks that case at
          # the point it happens.
          if grep -q '^build-error-' <<<"$names"; then
            {
              echo "## Build needs a human, not a resume"
              echo
              echo "Run \`$RUN_ID\` for \`$HEAD_SHA\` failed deterministically -"
              echo "a compile error, a patch failure, or a missing build output."
              echo "Resuming would rebuild to the same point and fail the same way."
              echo
              echo "The \`build-error-*\` artifact on that run has the exit code."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Run $RUN_ID failed deterministically - not resuming."
            exit 1
          fi

          if ! grep -q '^build-cache-' <<<"$names"; then
            {
              echo "## Build stalled with nothing to resume"
              echo
              echo "Run \`$RUN_ID\` for \`$HEAD_SHA\` exported no build cache, so"
              echo "there is no tree to continue from - it died in prep or in the"
              echo "first part, before exporting anything."
              echo
              echo "Dispatch Build manually to start it over."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Run $RUN_ID exported no build cache - a fresh build is needed."
            exit 1
          fi

          # A cache is not the same thing as compile progress, and on this
          # pipeline the two are easy to confuse: `prep` exports
          # build-cache-<arch> as well, holding the prepared source tree before
          # a single object file exists, under the same name the build parts
          # later overwrite. So a run stopped during build_part_01 leaves an
          # artifact the check above happily accepts.
          #
          # Resuming that is not a resume. resume-run-id only redirects
          # build_part_01's cache source and prep re-runs either way, so
          # importing a prep-only tree compiles everything from zero - a fresh
          # build that has also spent one of the two auto-resume attempts.
          #
          # Run 32935653134 is the case this was written for. It was stopped 21
          # minutes in with only prep finished, and this job dispatched a resume
          # of it that would have recompiled the whole tree.
          #
          # Whether any part actually finished is not a question the artifact
          # list can answer, so ask the jobs.
          parts=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "success")
                           | select(.name | contains("build_part_"))] | length')
          if [ "$parts" -eq 0 ]; then
            {
              echo "## Nothing compiled yet - a resume would be a fresh build"
              echo
              echo "Run \`$RUN_ID\` for \`$HEAD_SHA\` exported a build cache, but no"
              echo "\`build_part_\` job completed, so that cache is \`prep\`'s source"
              echo "tree with nothing built in it. Resuming would compile from zero"
              echo "and spend an auto-resume attempt doing it."
              echo
              echo "Dispatch Build without \`resume_run_id\` to start it over."
            } >> "$GITHUB_STEP_SUMMARY"
            # Red only when nobody asked for this. Stopping a run early to
            # replace it is the ordinary way to supersede one, and the
            # cancellation guards above already exit 0 rather than put a
            # failure in the Actions list for a deliberate act; a build that
            # died on its own in the first part is the case worth flagging.
            if [ "$CONCLUSION" = cancelled ]; then
              echo "Run $RUN_ID was stopped before any build part finished - nothing to resume."
              exit 0
            fi
            echo "Run $RUN_ID completed no build part - resuming it would compile from zero."
            exit 1
          fi
          # Cap the auto-retry chain per commit. Dispatches made with the
          # workflow token show actor github-actions[bot], so manual resumes
          # by a human don't count against the cap.
          attempts=$(gh api "repos/$REPO/actions/workflows/build.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '[.workflow_runs[] | select(.actor.login == "github-actions[bot]")] | length')
          if [ "$attempts" -ge 2 ]; then
            {
              echo "## Auto-resume cap reached"
              echo
              echo "\`$HEAD_SHA\` has been auto-resumed $attempts times without"
              echo "finishing. Something is wrong that resuming does not fix."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Already auto-resumed $attempts times for $HEAD_SHA - giving up, this needs a human."
            exit 1
          fi
          echo "Dispatching resume of run $RUN_ID (auto-attempt $((attempts + 1)))"
          gh api -X POST "repos/$REPO/actions/workflows/build.yml/dispatches" \
            -f ref=master -f "inputs[resume_run_id]=$RUN_ID"
