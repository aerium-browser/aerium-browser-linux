name: Build Linux AppImage for Aerium

# Aerium diverges from upstream here: upstream only builds on a version-tag
# push (tags: '[0-9]+.[0-9]+.[0-9]+.[0-9]+-[0-9]+'). We match Windows/Android's
# own convention instead - push-triggered + workflow_dispatch - so all three
# platform repos behave the same way. Every run is inherently a fresh source
# checkout at the `prep` stage (that's upstream's own design, not something we
# changed - see build-steps.yml), so there's no separate "fresh" input the way
# Windows/Android have one; the one thing worth resuming across runs is the
# multi-hour compile itself if a run gets killed (e.g. an accidental
# concurrency cancellation) - see `resume_run_id` below.
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Resume compiling from this earlier run''s last completed build-cache checkpoint instead of starting build_part_01 from a fresh prep. Does not skip `prep` itself (cheap relative to the compile) - only build_part_01''s cache source.'
        type: string
        required: false
        default: ''
  push:
    branches: [master]
    paths:
      - 'scripts/**'
      - 'docker/**'
      - 'patches/**'
      - 'package/**'
      - 'devutils/**'
      - 'flags.linux.gn'
      - 'ungoogled-chromium'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'

# Only the newest commit builds. A push supersedes whatever is in flight,
# because a build already compiling older sources cannot produce the artifact
# anyone now wants - it would spend hours to ship a binary that is wrong the
# moment it lands.
#
# This was false for a long time, for a real reason: pushes killed long builds.
# What made that a loss rather than the intended behaviour was that ANY push
# counted, including ones that changed nothing the build reads. The `paths`
# filter above is what answers that - a CHANGELOG or README push does not start
# a run here at all, so it cannot cancel one either. Superseding is then only
# ever triggered by a commit that genuinely changes what would be compiled.
#
# auto-resume.yml already assumed this: its cancelled-run branch checks whether
# the cancelled run's sha is still master's head and exits 0 when it is not,
# under the comment "only the newest commit builds". That guard has been
# waiting for this flag.
#
# Restricted to pushes, and that restriction is load-bearing. The only other
# thing that starts a build here is a workflow_dispatch, and auto-resume.yml
# sends one of those every time it decides a checkpoint is worth continuing. It
# guards against stacking by asking whether a run is already active - but that
# question is answered several API calls before the dispatch is actually made,
# so a push landing inside that window would be cancelled by the resume it
# raced. That trade is backwards twice over: it kills a build of the newest
# commit, and it replaces it with a run that restores an older commit's
# checkpoint tree. Making a dispatch queue instead, the way everything did
# before, costs nothing - a resume has no deadline - and leaves superseding to
# the one event that should do it.
concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write
  # The build action retires the previous checkpoint artifact once the
  # replacement is stored - see .github/scripts/checkpoint-slot.sh - and both
  # listing and deleting artifacts need this. Without it the delete fails
  # harmlessly and the run simply keeps two checkpoints until they expire.
  actions: write

jobs:
  build:
    name: Build ungoogled-chromium binaries and AppImage
    strategy:
      matrix:
        arch: [arm64, x86_64]
      max-parallel: 2
      fail-fast: true
    uses: ./.github/workflows/build-steps.yml
    with:
      arch: ${{ matrix.arch }}
      runs-on: ubuntu-latest
      resume-run-id: ${{ inputs.resume_run_id || '' }}

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/release
        env:
          # Prefer a PAT when one is configured: GITHUB_TOKEN's permissions
          # are capped by the enterprise/org/repo default and the workflow's
          # own `permissions: contents: write` cannot raise them past it,
          # which is currently blocking release creation in the Windows repo
          # with a 403. Composite actions can't read `secrets` themselves, so
          # the choice has to happen here and reach the action as an env var.
          # Empty secret falls through to GITHUB_TOKEN, so this stays inert
          # until RELEASE_TOKEN exists.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
